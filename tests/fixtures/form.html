<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BrowserPlug Form Fixture</title>
</head>
<body>
  <h1>Form fixture</h1>
  <!-- Labelled inputs (page_snapshot must surface accessible names) -->
  <form id="the-form">
    <label for="name">Full name</label>
    <input type="text" id="name" name="name" placeholder="Your name">

    <label for="email">Email address</label>
    <input type="email" id="email" name="email">

    <label for="bio">Biography</label>
    <textarea id="bio" name="bio"></textarea>

    <label for="color">Favourite colour</label>
    <select id="color" name="color">
      <option value="">--</option>
      <option value="r">Red</option>
      <option value="g">Green</option>
      <option value="b">Blue</option>
    </select>

    <label><input type="checkbox" id="agree" name="agree"> I agree</label>

    <!-- Two buttons with identical text; one is hidden (the hidden twin) -->
    <button type="button" id="ghost-save" style="display:none">Save</button>
    <button type="button" id="real-save" onclick="document.getElementById('saved').textContent='SAVED:'+document.getElementById('name').value">Save</button>

    <!-- A disabled control (snapshot must mark enabled:false) -->
    <button type="button" id="disabled-btn" disabled>Disabled action</button>

    <a href="#somewhere" id="a-link">A link</a>
  </form>

  <div id="saved"></div>
</body>
</html>
