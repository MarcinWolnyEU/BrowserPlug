<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>element-shot fixture</title>
<style>
  html, body { margin: 0; padding: 0; font-family: sans-serif; }
  .spacer { height: 1500px; padding: 12px; }
  /* The capture target: a known size and a known solid green, placed below the
     fold so an element screenshot must scroll to it. */
  #target { width: 300px; height: 200px; background: #11aa44; color: #fff;
            display: flex; align-items: center; justify-content: center; }
  .dup { width: 60px; height: 40px; background: #888; margin-top: 8px; }
</style>
</head>
<body>
  <div class="spacer">ELEMENT_SHOT_TOP — DISTINCTIVE_MARKER_ELEMENT_SHOT</div>
  <div id="target">TARGET ELEMENT</div>
  <div class="dup">dup A</div>
  <div class="dup">dup B</div>
</body>
</html>
