<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BrowserPlug Lazy Element Fixture</title>
</head>
<body>
  <h1>Lazy element fixture</h1>
  <p>#ready appears after exactly 1200ms. #never never exists.</p>
  <div id="container"></div>
  <script>
    setTimeout(function () {
      var d = document.createElement('div');
      d.id = 'ready';
      d.textContent = 'READY';
      document.getElementById('container').appendChild(d);
    }, 1200);
  </script>
</body>
</html>
