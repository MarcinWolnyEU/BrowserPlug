[pytest]
# A bare `pytest` in tests/ runs the fast, browser-free layers. Integration launches real
# browsers, so it runs only when named: `uv run --locked --script tests/run.py
# --integration` (parallel, then the `timing` tests serially, about 12 min) or
# `tests/run.py integration/` (one process, about 23 min). BROWSERPLUG_TEST_BROWSERS=firefox
# or chromium picks one engine.
testpaths = unit parity
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    firefox_only: Integration test that runs ONLY under the firefox engine param. First
        positional arg is a REASON string (e.g. @pytest.mark.firefox_only("per-tab SOCKS
        proxy routing has no Blink equivalent")). Collected-under-chromium copies are
        DESELECTED by pytest_collection_modifyitems; the parity validator cross-checks
        these against tests/parity/parity.toml.
    chromium_only: Integration test that runs ONLY under the chromium engine param. Same
        reason-string convention as firefox_only; chromium-collected copies run, firefox
        copies are deselected.
    timing: Integration test that needs a quiet machine, so `tests/run.py --integration`
        runs it in the serial phase after the parallel one. It asserts a wall-clock bound,
        races the browser on purpose, or sleeps a fixed time in place of a condition, and
        contention from parallel browsers moves the clock. test_default_ports is here
        because it walks the production MCP port range.
asyncio_mode = auto
# Hang guards. faulthandler_timeout (built into pytest) dumps every thread's stack when a
# test runs past it and lets the test carry on; pytest-timeout (tests/run.py)
# then fails the test, so a wedged await ends the run instead of holding it forever. Both
# ceilings sit above the slowest integration test.
faulthandler_timeout = 180
timeout = 600

# Warnings are shown. Deprecations from mcp, pydantic, websockets, starlette, httpx2 and
# uvicorn are the early notice of a dependency major that breaks startup: never add an
# ignore for those. Ignore a known-noisy third-party warning by module and category, one
# line each with the reason.
filterwarnings =
    default
