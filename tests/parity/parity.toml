"browser-proxy.test.mjs"      = { scope = "chromium_only", reason = "the browser-WIDE SOCKS proxy: chrome.proxy has no per-request hook, so a proxy on tabs.create / navigation.navigate / tabs.routing switches the whole browser behind the popup's consent switch, since Chrome allows no optional proxy permission (gecko routes one tab, proxy.test.mjs). Covers the switch-before-load order, the fail-closed refusals, the loopback/server bypass, and the glue that undoes it by itself (socket close, watchdog, startup, install)." }
"scheme-probe.test.mjs"      = { scope = "chromium_only", reason = "scheme-probe.js and offscreen.js exist only on Chromium: the MATCH_MEDIA offscreen document that tells the worker light or dark mode, which gecko's background page reads itself." }
"content-relay.test.mjs"     = { scope = "chromium_only", reason = "two-realm content.js + content-main.js console/D5a net_body relay (20-entry/300ms/500-cap batching); no gecko counterpart because gecko hooks the console inline (design.md D3)." }

