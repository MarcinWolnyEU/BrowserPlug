"fileaccess.test.mjs"       = { scope = "twin", of = "fileaccess.test.mjs" }
"fileurl.test.mjs"          = { scope = "twin", of = "fileurl.test.mjs" }
"testgate.test.mjs"         = { scope = "twin", of = "testgate.test.mjs" }
"navdiag.test.mjs"          = { scope = "twin", of = "navdiag.test.mjs" }
"pageread.test.mjs"         = { scope = "twin", of = "pageread.test.mjs" }
