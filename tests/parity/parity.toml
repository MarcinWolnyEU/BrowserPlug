# ---------------------------------------------------------------------------------------
# Invariant G — integration modules. Every tests/integration/test_*.py must either consume
# the parametrized server_with_extension fixture (runs BOTH engines) OR appear below with a
# reason. Modules carrying a MODULE-LEVEL firefox_only/chromium_only marker MUST appear here
# even though they use the fixture (the marker deselects the other engine).
#
# inline_engine_tests = [...] declares tests pinned to ONE engine by CONSTRUCTION — they build
# their own <Engine>TestManager rather than taking the parametrized fixture, so they carry no
# marker, are never "deselected", and their module can still satisfy the fixture check via its
# other tests. Invariant G finds them by AST and requires the list to match EXACTLY (an
# undeclared one and a stale entry both fail), so this stays honest as modules change.
# ---------------------------------------------------------------------------------------
[integration]
"test_proxy_routing.py" = { engine = "firefox", scope = "module", reason = "whole-module firefox_only: per-tab SOCKS routing rides browser.proxy.onRequest, a Firefox-only model. Chromium has the browser-wide counterpart in test_browser_wide_proxy.py." }
"test_browser_wide_proxy.py" = { engine = "chromium", scope = "module", reason = "whole-module chromium_only: chrome.proxy switches the WHOLE browser (no per-request hook), the Chromium counterpart of Firefox per-tab routing in test_proxy_routing.py. The harness bakes the popup's consent switch on." }
"test_firefox_extension_communication.py" = { engine = "firefox", scope = "module", inline_engine_tests = ["test_extension_can_connect_to_server", "test_bidirectional_message_flow"], reason = "does not consume server_with_extension: inline FirefoxTestManager + running_server. Firefox-only connect/comms regression; chromium connect coverage comes from the parametrized modules + the harness bring-up. Only the 2 inline_engine_tests actually launch a browser; the other 4 are server-only websocket tests and are engine-neutral." }
"test_eval_worlds.py" = { engine = "firefox", scope = "module", reason = "whole-module firefox_only: SUBJECT is page_eval running user-supplied code (isolated vs main world). page_eval is gated on chromium behind the un-grantable 'Allow user scripts' toggle -> EVAL_UNAVAILABLE headlessly (design.md D4/D12), so eval-subject tests are firefox-only." }
"test_mcp_server_integration.py" = { engine = "firefox", scope = "module", inline_engine_tests = ["test_extension_websocket_connection", "test_full_chain_mcp_to_browser_action"], reason = "does not consume server_with_extension: inline full_mcp_system + inline FirefoxTestManager. Firefox-only; chromium full-chain coverage comes from the parametrized modules. Only the 2 inline_engine_tests launch a browser; the other 4 exercise full_mcp_system without one." }
"test_mcp_integration.py" = { engine = "none", scope = "module", reason = "server-only: mock_websocket_server, no browser launched. Engine-neutral, runs once." }
"test_mcp_protocol_compliance.py" = { engine = "none", scope = "module", reason = "server-only canary (pins the 9-tool surface) via coordinated_test_ports, no browser launched. Engine-neutral, runs once." }
# Engine-bound BY CONSTRUCTION, no marker involved: the module DOES consume the parametrized
# fixture (so the module-level check passes on its other tests), but this test builds its own
# FirefoxTestManager and therefore never runs under chromium. invariant G detects the
# construction via AST and requires it to be listed here.
"test_real_firefox_communication.py" = { engine = "firefox", scope = "partial", inline_engine_tests = ["test_extension_configuration_persistence"], reason = "SUBJECT is the gecko profile-config carrier itself: it asserts the extension's settings landed in <profile>/storage-sync-v2.sqlite, which is the Firefox harness's port-seeding mechanism. Chromium seeds the equivalent through the config.js bake (design.md D11), a different mechanism covered by the chromium harness bring-up. Its other 2 non-parametrized tests launch no browser (raw websockets against BrowserPlugServer) and are engine-neutral." }

# Partial (per-method) engine exemptions — the module still runs parametrized on both engines
# for its other tests; these named methods carry a firefox_only marker. Recorded for
# documentation; invariant G verifies each such marker call carries a reason string.
"test_browser_functionality.py" = { engine = "firefox", scope = "partial", methods = ["test_end_to_end_content_execute_script", "test_end_to_end_tab_screenshot_capture"], reason = "content.execute page_eval needs the un-grantable 'Allow user scripts' toggle (EVAL_UNAVAILABLE headlessly); default-tab screenshot targets chrome://newtab which captureVisibleTab cannot capture (design.md D4/D6/D12)." }
"test_request_monitoring_end_to_end.py" = { engine = "firefox", scope = "partial", methods = ["test_response_body_capture_verification", "test_body_correlation_attaches_captured_content"], reason = "document-body StreamFilter response capture is gecko-only; MV3 has no blocking webRequest body read (design.md D5). The monitor-lifecycle/request-log tests stay parametrized." }
"test_agent_experience.py" = { engine = "firefox", scope = "partial", methods = ["test_page_eval_main_vs_isolated_world", "test_reads_reliable_across_reload_churn", "test_element_and_full_page_capture_are_one_shot"], reason = "eval-SUBJECT + one-shot-capture cases: user-supplied page_eval needs the un-grantable 'Allow user scripts' toggle (EVAL_UNAVAILABLE headlessly) and captureTab({rect}) one-shot has no MV3 equivalent — Chromium element/full_page shots scroll+stitch by design (design.md D4/D6/D12). Every OTHER agent-experience case runs on BOTH engines; their DOM VERIFICATION is engine-aware (page_read/page_snapshot/page_act on chromium) so the snapshot/act/fill/iframe/wait features are genuinely exercised under chromium." }
"test_window_management.py" = { engine = "firefox", scope = "partial", methods = ["test_window_focus_switching"], reason = "SUBJECT is which WINDOW is focused after a tab activate. headless Chrome has no window manager, so chrome.windows.update({focused:true}) is a no-op — the focused window never changes (the chromium tabs.switch handler is a byte-faithful port that DOES call windows.update focused; the browser cannot honor it headlessly). Every other window test (create/close/move/list/bounds) runs on BOTH engines." }

# ---------------------------------------------------------------------------------------
# Invariant I — blocks that were ported to be IDENTICAL, and must stay that way.
#
# Most of background.js legitimately diverges (that is why it is a platform twin), but some
# blocks are pure orchestration over engine-neutral primitives and were ported verbatim on
# purpose. Nothing stopped the two copies drifting: invariant E only checks that a slice
# ANCHOR still exists, not that what is between the anchors still agrees. A divergence there
# would mean one engine quietly getting different act/timeout semantics, with both trees'
# twin suites green (each tests its own copy).
#
# Comparison is over CODE lines only — blank lines and whole-line // comments are dropped —
# so the prose may name each engine's own API. Anything else must match exactly.
[[identical_blocks]]
name  = "content.act step deadline + step loop"
file  = "background.js"
start = "// ---- content.act step deadline"
end   = "// Content handlers"
reason = """actStepBudget/actClampWait/actTimeoutReport/runActStepWithDeadline/runActSteps are
pure orchestration over tabs.get + TAB_NAV + the digests — all of which exist identically on
both engines — so the ONLY sanctioned difference is which injection API the prose names. The
timeout verdicts are agent-facing contract text; if one engine's copy drifts, an agent gets a
different answer to the same failure depending on which browser it happens to be driving.
The block ALSO owns the measurement + quiescence orchestration (actMeasure /
actCountsSame / actMeasureSettled / actZipCounts / actEffect and the before/after hooks in
runActSteps). That makes its code-identity load-bearing in a new way: the count and node
deltas it produces are NUMBERS the agent reads back, so a drift means the same page answers
"+8 rows" on one engine and "no change" on the other."""

[[identical_blocks]]
name  = "navigation landing diagnostics"
file  = "background.js"
start = "// ---- navigation landing diagnostics"
end   = "async function handleNavigationAction("
reason = """mainFrameOutcome/navUrlBefore are pure reads over TAB_REQUESTS + tabs.get, both of
which exist identically on either engine (MV3's observe-only webRequest still delivers
onCompleted.statusCode). The facts they collect — the main document's HTTP status and the
pre-navigation URL — are what the server turns into agent-facing correctness warnings; if one
tree's copy drifts, an agent gets a different answer about whether it landed where it asked
depending on which browser it happens to be driving. The two redirect MODELS differ (gecko
replaces the channel, chromium keeps one requestId) but the backwards scan is correct under
both, so each tree words that note on its own comment line and the code stays identical."""

# ---------------------------------------------------------------------------------------
# Invariant F — manifest capability correspondence, and Invariant H — version lockstep.
# ---------------------------------------------------------------------------------------
[manifest]
gecko_manifest_version    = 2
chromium_manifest_version = 3

[manifest.gecko_permissions]
# Every entry in extension-gecko/manifest.json "permissions" + "optional_permissions".
# chromium = the MV3 permission it maps to, or "absent" (dropped by design, with a reason),
# or "host_permissions" (moved out of the permissions array in MV3).
tabs               = { chromium = "tabs" }
storage            = { chromium = "storage" }
alarms             = { chromium = "alarms" }
menus              = { chromium = "contextMenus", reason = "MV3 renamed the menus permission to contextMenus." }
webRequest         = { chromium = "webRequest", note = "observe-only in MV3 (no blocking)." }
webRequestBlocking = { chromium = "absent", reason = "blocking webRequest was removed in MV3; the StreamFilter/Accept-Encoding body-capture path is gecko-only (design.md D5)." }
webNavigation      = { chromium = "webNavigation" }
clipboardWrite     = { chromium = "clipboardWrite", note = "the popup/options copy buttons; clipboardRead was dropped 2026-08-03 with content.read_clipboard." }
"<all_urls>"       = { chromium = "host_permissions", reason = "MV3 moves host match patterns from permissions to host_permissions (design.md D9)." }
proxy              = { chromium = "proxy", note = "optional on gecko, REQUIRED on chromium: Chrome rejects proxy under optional_permissions (\"cannot be listed as optional\"). Per-tab routing is impossible on Blink (chrome.proxy is global-only), so the permission backs the browser-wide proxy, which stays off until the user turns on the popup switch (.tmp/dev-docs/proxy-connections.md)." }

[manifest.chromium_additions]
# Chromium permissions with NO gecko counterpart — each an intentional MV3 addition.
scripting   = "chrome.scripting.executeScript replaces gecko's tabs.executeScript for injecting automation.js / defuddle.js and fixed-function page probes (design.md D4)."
userScripts = "chrome.userScripts.execute runs page_eval user-supplied code in USER_SCRIPT/MAIN world; MV3 removed tabs.executeScript(code) (design.md D4)."
sidePanel   = "the MV3 side_panel API requires the sidePanel permission (gecko's sidebar_action needs none)."
offscreen   = "chrome.offscreen hosts the MATCH_MEDIA document scheme-probe.js uses to learn light or dark mode, which a service worker cannot read; gecko's background page has matchMedia itself. Raises no install warning."

[manifest.chromium_host_additions]
# host_permissions entries beyond <all_urls> (which is accounted for by the gecko <all_urls> row).
"http://127.0.0.1/*" = "explicit loopback host permission for the /ws-token bootstrap fetch; gecko reaches it via <all_urls> (design.md D9)."
"http://localhost/*" = "explicit loopback host permission for the /ws-token bootstrap fetch; gecko reaches it via <all_urls> (design.md D9)."

[manifest.key_mapping]
# Non-permission top-level manifest keys that differ by engine (each accounted for).
background  = { gecko = "background.scripts+persistent", chromium = "background.service_worker", reason = "MV2 persistent background page vs MV3 service worker (design.md D1)." }
action      = { gecko = "browser_action", chromium = "action", reason = "MV3 renamed browser_action to action." }
side_panel  = { gecko = "sidebar_action", chromium = "side_panel", reason = "MV3 replaces sidebar_action with side_panel." }
gecko_id    = { gecko = "browser_specific_settings.gecko.id", chromium = "absent", reason = "chromium loads unpacked / by key; there is no gecko application id." }
data_consent = { gecko = "browser_specific_settings.gecko.data_collection_permissions", chromium = "absent", reason = "Firefox's built-in data-collection consent prompt; AMO REQUIRES the key for new submissions (addons-linter errors without it). Chrome has no manifest equivalent — the Web Store declares data use in the listing, not the manifest." }
android     = { gecko = "browser_specific_settings.gecko_android", chromium = "absent", reason = "the gecko_android object is what makes AMO sign the XPI as Firefox-for-Android compatible; omit it and the signed build is desktop-only. It carries its own strict_min_version (142.0) because data_collection_permissions reached Android in 142, and an empty object inherits desktop's 140, which addons-linter reports (KEY_FIREFOX_ANDROID_UNSUPPORTED_BY_MIN_VERSION). Chromium on Android loads no extensions at all, so there is nothing to map." }
csp         = { gecko = "absent", chromium = "content_security_policy", reason = "MV3 requires an explicit extension_pages CSP; MV2 uses a permissive default." }
icons       = { gecko = "icons + browser_action.default_icon", chromium = "icons + action.default_icon", reason = "same key names. Both default_icon entries name the LIGHT glyph set, which toolbar-icon.js corrects a tick later once the theme (Firefox) or the offscreen probe (Chromium) has answered. Chromium's small icons sizes use the static dark tile, drawn for a 16 px slot." }
min_version = { gecko = "absent", chromium = "minimum_chrome_version", reason = "declares Chrome 138+ for the userScripts gate (design.md D4)." }
