# BrowserPlug gecko/chromium parity registry (design.md D14).
#
# ONE declarative source of truth read by tests/parity/test_parity.py. It records what
# MUST correspond between extension-gecko/ (Firefox MV2) and extension-chromium/ (Chrome
# MV3): byte-identical shared files, platform twins that legitimately diverge, chromium-only
# additions, the JS-test twin map, integration-module engine exemptions, and the manifest
# capability mapping. Every divergence is either MAPPED here or fails the validator.
#
# RULE FOR FUTURE AGENTS: when the validator fails, fix the CLASSIFICATION in this file only
# if the divergence is design-sanctioned (design.md D5/D6/D7 gaps, the userScripts toggle,
# the FF152 redirect model, the profile-isolation mechanism). Anything else is a real defect
# in the ports — fix the code, not this registry. Every exemption below carries a reason=.

[trees]
gecko    = "extension-gecko"
chromium = "extension-chromium"

# ---------------------------------------------------------------------------------------
# Invariant C — file classification. Every file in EITHER tree must be exactly one of:
# shared (byte-identical), a platform twin (present in both, allowed to differ), or
# platform-only (chromium_only / gecko_only). An unclassified file fails the validator.
# ---------------------------------------------------------------------------------------

[shared]
# Byte-identical between the two trees (sha256-equal). design.md D2. Relpaths are
# tree-relative with forward slashes. _locales/** is expanded from `globs`.
files = [
  "automation.js",
  "options.html",
  "options.js",
  "wan-diagnosis.js",
  "toolbar-icon.js",
  "connection-journal.js",
  "body-censor.js",
  "censor-panel.js",
  "token-trust.js",
  "ws-crypto.js",
  "vendor/mlkem.js",
  "popup/popup.html",
  "popup/popup.js",
  "popup/popup-tabs.js",
  "popup/usage-pane.js",
  "popup/chromium-access.js",
  "vendor/defuddle.js",
  "vendor/period-history.js",
  "vendor/usage-chart.js",
  "vendor/anthropic-data.js",
  "vendor/anthropic-view.js",
  "vendor/kilocode-view.js",
  "vendor/deepseek-view.js",
  "vendor/openai-data.js",
  "vendor/openai-view.js",
  "vendor/copilot-data.js",
  "vendor/copilot-view.js",
  "vendor/kilocode-modelnames-data.js",
  "vendor/usage-sampler.js",
]
# icons/app/*.png (the manifest "icons" art and the popup/options logos) and the two
# toolbar glyph sets are byte-identical in both trees: both pick between the same light
# and dark sets at runtime (toolbar-icon.js). Only the static tile is Chromium's own.
globs = ["_locales/**/*.json", "icons/app/*.png", "icons/toolbar/*/*/*.png"]

[platform_twins]
# Present in BOTH trees, but intentionally diverge by engine (no byte-identity required).
"background.js" = "MV2 persistent background page vs MV3 service worker; webRequest/proxy/StreamFilter/injection all differ (design.md D1/D4/D5)."
"content.js"    = "gecko hooks the page console inline; chromium content.js is an ISOLATED-world relay of the MAIN world's __browserplugConsole events and __browserplugNetBody messages (design.md D3)."
"manifest.json" = "manifest_version 2 vs 3; background/action/permission/host_permissions keys differ (design.md D2/D9)."

[chromium_only]
# Files that exist ONLY in extension-chromium/ (no gecko counterpart), each design-sanctioned.
"config.js"       = "BUILD_CONFIG bake target for the test harness (null in production); the sqlite-stamp analog for MV3 (design.md D12)."
"shim.js"         = "importScripts'd first in the SW; sets globalThis.browser = browser||chrome so shared idioms/vendor data modules run unchanged (design.md D2)."
"scheme-probe.js" = "importScripts'd in the SW: keeps an offscreen document alive and forwards the colour scheme it reports to toolbar-icon.js setTheme(). Gecko's background page reads theme.getCurrent()/matchMedia itself."
"offscreen.html"  = "the offscreen document (reason MATCH_MEDIA) scheme-probe.js creates; an MV3 worker has no matchMedia."
"offscreen.js"    = "the offscreen page's script: runs matchMedia('(prefers-color-scheme: dark)') and reports it to the worker."
"content-main.js" = "MAIN-world content script (world:MAIN, document_start): CSP-immune console hook + fetch/XHR body-capture wrapper (design.md D3/D5)."

[gecko_only]
# Files that exist ONLY in extension-gecko/, one relpath per row. None today — every
# individually-named gecko file is shared or a platform twin. The section is intentionally
# present so a future gecko-only file must be classified here with a reason rather than
# silently failing exhaustiveness. Whole DIRECTORIES go in [gecko_only_globs]

[chromium_only_globs]
"icons/tile/*.png" = "the static dark TILE for the two places a browser draws the extension icon on a surface toolbar-icon.js does not control (the manifest `icons` 16 and 32 keys: chrome://extensions and the like). Rendered by assets/icons/render.py."

# ---------------------------------------------------------------------------------------
# Invariant A — action-string set parity between the two background.js.
# ---------------------------------------------------------------------------------------
[action_strings]
# Minimum action strings each background.js must yield (guards a regex that matches nothing).
# 52 is the current exact count and the floor (51 until the case regex learnt camelCase
# verbs and found `tabs.captureVisibleTab`, which it had skipped in both trees). It was 56 until the 2026-08-03 authorized
# removals took FIVE actions out of BOTH trees together: content.read_clipboard (0 uses in
# 3,112 calls, and the only zero-usage capability whose retention cost a sensitive
# permission plus, on Chromium, a whole offscreen-document subsystem), the three history.*
# actions (the history TOOL was deleted server-side), and test.clear_test_history — a test
# helper that existed ONLY to clean up after the history tests and whose browser.history.*
# calls cannot work now that the permission is gone. Recompute this number when actions
# move; never lower it to paper over a parse failure.
floor = 52
# Case labels present in only ONE tree, each with a reason below. Empty today: the two
# trees expose the identical 52 actions (incl. the 8 test.* helpers).
exempt = []
[action_strings.reasons]
# "area.verb" = "why this action exists in only one engine"

# ---------------------------------------------------------------------------------------
# Invariant J — every literal wire action the SERVER sends is handled by BOTH extensions.
# The extractor (parity_lib.parse_server_sent_actions) walks server/ with `ast`.
# ---------------------------------------------------------------------------------------
[server_sent_actions]
# Minimum literal actions the extractor must find (guards a parse that matches nothing).
floor = 30
# `<x>.request(<variable>, ...)` call sites: the extractor cannot read a variable, so each
# one is named here with the reason its values are still covered. A new one fails until
# it is listed, which is the prompt to check what it can send.
[server_sent_actions.dynamic_sites]
"server/tools/navigate.py" = "the fused read leg: the action comes from fused_read.read_plan, whose literals (content.read, content.snapshot) the extractor does read."

# ---------------------------------------------------------------------------------------
# Invariant B — __browserplugAuto method-set parity (automation.js is shared, this guards a fork).
# ---------------------------------------------------------------------------------------
[automation_methods]
# Exact current count of the invokeMethod switch (snapshot/click/fill/select/check/press/
# hover/scroll/wait_for/wait_check/page_state/inspect/rect = 13). Floor guards a vacuous
# parse; the set-equality check across trees is the primary guard. It was 14 until the
# 2026-08-03 removal of read_clipboard. NOTE the switch now lives in invokeMethod, declared
# BETWEEN parity_lib's _INVOKE_START ("self.invoke = async function") and _INVOKE_END
# ("window.__browserplugAuto = self;") — move it outside that window and this parses 0 methods.
floor = 13

# ---------------------------------------------------------------------------------------
# Invariant D — disposition of every JS test. Exhaustive in BOTH directions:
#   - every tests/js/*.test.mjs is classified in [js_tests.gecko]
#   - every tests/js-chromium/*.test.mjs is classified in [js_tests.chromium]
# scope ∈ {shared, twin, gecko_only, chromium_only}. See design.md D13.
# ---------------------------------------------------------------------------------------
[js_tests.gecko]
"automation.test.mjs"               = { scope = "shared" }
"records.test.mjs"                  = { scope = "shared", note = "page_snapshot mode=\"records\": repeated-card detection + per-card field scoping + variant ambiguity. Slices nothing — it drives the SHARED automation.js under jsdom, so one run covers both trees." }
"click-state.test.mjs"              = { scope = "shared", note = "click state confirmation (control checked-before/after, dangling label[for], collapsed ancestor). Drives the SHARED automation.js under jsdom, so one run covers both trees." }
"perception-extras.test.mjs"        = { scope = "shared" }
"kilocode-view.test.mjs"            = { scope = "shared" }
"deepseek-view.test.mjs"            = { scope = "shared" }
"anthropic-view.test.mjs"           = { scope = "shared" }
"anthropic-data.test.mjs"           = { scope = "shared" }
"openai-view.test.mjs"              = { scope = "shared" }
"openai-data.test.mjs"              = { scope = "shared" }
"copilot-view.test.mjs"             = { scope = "shared" }
"copilot-data.test.mjs"             = { scope = "shared" }
"kilocode-modelnames-data.test.mjs" = { scope = "shared" }
"options.test.mjs"                  = { scope = "shared" }
"body-censor.test.mjs"              = { scope = "shared", note = "the SHARED body-censor.js behind Options > General > Captured bodies: key masking per body shape (JSON walk, form, multipart, text fallback), the custom-pattern rules, the backtracking heuristic and the result marker. Drives the shared file directly, so one run covers both trees." }
"censor-glue.test.mjs"              = { scope = "twin", note = "the glue between requests(get) and the shared body-censor.js: censorRequestBodies() and its call in handleRequestsAction, sliced out of its own tree's background.js on the request-monitoring anchors. Twin rather than shared because the glue is in background.js, a platform twin, and the two trees capture bodies by different mechanisms (StreamFilter vs the page fetch/XHR wrapper). Deleting the call turns it red while body-censor.test.mjs stays green." }
"options-map.test.mjs"              = { scope = "shared" }
"options-default-browser.test.mjs"  = { scope = "shared" }
"usage-sampler.test.mjs"            = { scope = "twin", note = "the background clock behind the \"Query every N min\" checkbox: the SHARED vendor/usage-sampler.js (arm/disarm, the alarms.get guard against a cold start restarting the schedule, alarm dispatch) AND the arming glue, sliced out of its own tree's background.js on the provider-usage-settings anchors. Twin rather than shared because the glue is in background.js, a platform twin, and the cold-start hazard the guard exists for is an MV3 one." }
"toolbar-icon.test.mjs"             = { scope = "twin", note = "the shared toolbar-icon.js (state x theme -> icon paths) AND the arming glue: it slices updateActionIndicator out of its own tree's background.js and asserts each connection phase reaches apply() with the right state. Twin rather than shared because the two engines resolve the theme differently — gecko has theme.getCurrent()/matchMedia, the MV3 worker has neither." }
"popup.test.mjs"                    = { scope = "shared", note = "popup/* are byte-identical; the test also slices background.js (updateActionIndicator..setConnectionPhase), a diverging file — those anchors are cross-checked in BOTH trees by invariant E." }
"popup-tabs.test.mjs"               = { scope = "shared", note = "the popup's tab strip (popup/popup-tabs.js): restore from storage.local, click and arrow-key switching, the onShow report. Drives the SHARED file against the real popup.html under jsdom." }
"usage-pane.test.mjs"               = { scope = "shared", note = "the popup's Usage tab (popup/usage-pane.js): one card per provider in every state, drawn from the SHARED view modules under jsdom with a fixed clock." }
"chromium-access.test.mjs"        = { scope = "shared", note = "the popup's Allow user scripts card and the \"scripts are blocked\" status link (popup/chromium-access.js): the shared popup run under jsdom as Chromium (a chrome global, no browser) and as Firefox." }
"connection.test.mjs"               = { scope = "twin" }
"tokenbootstrap.test.mjs"           = { scope = "twin" }
"identity.test.mjs"                 = { scope = "twin" }
"journal.test.mjs"                  = { scope = "twin", note = "the connection journal and the cached hello: the SHARED connection-journal.js (ring cap, storage write-through, the since-last-hello window, the 120-char reason cap, the startup load a force-killed browser leaves behind) AND the glue, sliced out of its own tree's background.js on the connection-block anchors. Twin rather than shared because the glue is in background.js, a platform twin, and the two trees build the cached hello from different identity sources and load the shared file by different mechanisms (background.scripts vs importScripts)." }
"actwait.test.mjs"                  = { scope = "twin" }
"observability.test.mjs"            = { scope = "twin" }
"neterror.test.mjs"                 = { scope = "twin" }
"requests-capture.test.mjs"         = { scope = "twin" }
"acttimeout.test.mjs"               = { scope = "twin" }
"fileaccess.test.mjs"               = { scope = "twin" }
"fileurl.test.mjs"                  = { scope = "twin", note = "fileUrlRefusal: a file:// open/navigate refusal that QUERIES the tab list instead of asserting an outcome (Firefox 153 creates no tab; an older Firefox did), and reports the READ permission as the separate, grantable thing it is. Twinned because each tree names its own toggle and its own engine reality." }
"testgate.test.mjs"                 = { scope = "twin", note = "the test.* gate: a normal build refuses all eight actions with TEST_ACTIONS_UNSUPPORTED and runs no handler; the harness path enables them. Twinned because the gates differ on purpose: gecko reads the harness-seeded testPort+testHostname from storage.sync (its harness installs the shipped .xpi), chromium reads the baked BUILD_CONFIG.testMode." }
"count-delta.test.mjs"              = { scope = "shared", note = "quantitative content delta, PAGE half: element-node counting in the click observer, inspect(count:) and the nodesAtStart/nodesAtEnd carrier on every invoke result. Drives the SHARED automation.js under jsdom (plus the counted-load-more fixture), so one run covers both trees." }
"actdelta.test.mjs"                 = { scope = "twin", note = "quantitative content delta, BACKGROUND half: the before/after pairing, the quiescence poll that outlives the network-quiet settle, actZipCounts/actEffect, and the delta on a TIMED-OUT step. Reuses the existing act-deadline slice anchors." }
"pageread.test.mjs"                 = { scope = "twin", note ="content.read window: the offset clamp, the max_chars=0 length probe, docMetrics, and the extraction cache (invalidation, no observer during an extraction, the inert-script rule). Slices runContentRead by anchor and drives the REAL driver — the gecko copy evals the code string it builds, the chromium copy invokes the func it passes." }
"navdiag.test.mjs"                  = { scope = "twin", note ="mainFrameOutcome + navUrlBefore: main-document HTTP status, redirect stitching under BOTH redirect models, the sub-resource guard, and the pre-navigation url. Inherited the redirect/mainReq cases that observability.test.mjs used to slice out of the middle of the navigate case body." }
"console-flush.test.mjs"            = { scope = "twin", note = "the console flush: navigate (every wait), a page_act step and its timeout report, and console.read ask the tab's relay for the entries TAB_CONSOLE may not hold yet before reading it, an entry that arrives in a batch and in the answer counts once, the digest keeps to the call's own window (navigate's also to the document that answered), and a relay that never answers is bounded and reported. Also drives its own tree's content.js under jsdom (the answer in the task that receives the request, batches still in flight carried again). Twin because the relay differs: gecko hooks the page console inline, chromium takes MAIN-world events from content-main.js." }
"refstale.test.mjs"                 = { scope = "twin", note = "snapshot ref staleness: a failed REF lookup becomes REFS_STALE only when documentId proves the document changed. Twinned because the baseline map's lifetime differs (gecko's persistent background page vs. chromium's evictable SW memory), which is exactly the unknown-is-not-changed case." }
"proxy.test.mjs"                    = { scope = "gecko_only", reason = "per-tab SOCKS routing rides browser.proxy.onRequest + proxyDecisionSync null-termination; chrome.proxy has no per-request hook (design.md D7). Chromium has the browser-wide equivalent in browser-proxy.test.mjs." }
"eval-errors.test.mjs"             = { scope = "gecko_only", reason = "the page_eval wrapper (evalWrapperCode) and the retry loop that once re-ran a script whose own throw rejected tabs.executeScript, then called it an injection failure. Chromium runs code strings through userScripts.execute, which returns a script's throw as InjectionResult.error with no retry loop, and its eval path sits behind the Allow user scripts gate that no test reaches." }
"capture-errors.test.mjs"          = { scope = "gecko_only", reason = "captureScreenshot's two paths: when captureTab and then the captureVisibleTab fallback both fail, the thrown error names both (bothCapturesFailed), and the fallback still restores the user's tab. Chromium has no captureTab, so its capture has a single path and a single error." }
"capture-stall.test.mjs"           = { scope = "gecko_only", reason = "the Firefox capture run: a deadline under the server timeout, bounded steps, a stalled captureTab never falling through to the activating fallback, and the previous tab restored (once) when a stalled fallback is cut off. Chromium activates the tab first and has no captureTab." }
"open-net-error.test.mjs"          = { scope = "gecko_only", reason = "failedMainFrameError: Firefox commits its own error page for a refused or reset connection and onCommitted wipes lastNavError, so tabs.create / windows.create call the open a success unless the request log is read. Chromium reports these without help (measured by tests/integration/test_open_net_error.py on both engines)." }

[js_tests.chromium]
"connection.test.mjs"       = { scope = "twin", of = "connection.test.mjs" }
"tokenbootstrap.test.mjs"   = { scope = "twin", of = "tokenbootstrap.test.mjs" }
"identity.test.mjs"         = { scope = "twin", of = "identity.test.mjs" }
