name: Release

# Pushing a tag vMAJOR.MINOR.PATCH (optionally with an aN, bN, rcN or .devN suffix) builds the
# packages, signs their provenance and publishes a GitHub release. Uploading to the Firefox
# and Chrome stores stays manual (.tmp/dev-docs/firefox-release.md, chrome-web-store.md).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The whole CI workflow runs on the tagged commit first. Nothing is built for release unless it passes.
  ci:
    name: CI on the tagged commit
    # The `$/` self-repository form that zizmor prefers is not understood by actionlint 1.7.12.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    with:
      release: true
    permissions:
      contents: read

  # Everything that runs third-party code (uv, npx, the builders) has no token to steal: this
  # job only reads the repository. Signing happens in the separate `attest` job, which runs
  # no project or tool code.
  build:
    name: Build and verify the packages
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      base_version: ${{ steps.version.outputs.base_version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, to check the tag against main
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.18"
          python-version: "3.12"
          enable-cache: false # never restore caches in a release job (cache poisoning)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.15.0"
          package-manager-cache: false
      - name: Check the tagged commit is on main
        env:
          TAG_SHA: ${{ github.sha }}
        run: |
          git merge-base --is-ancestor "${TAG_SHA}" origin/main \
            || { echo "::error::the tagged commit is not reachable from main"; exit 1; }
      - name: Check the tag against the four version carriers
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: uv run --script scripts/check_release_version.py --tag "${TAG}" --github-output "${GITHUB_OUTPUT}"
      - run: uv run --script build_xpi.py
      - run: uv run --script build_source_zip.py
      - run: uv run --script build_server_zip.py
      - name: Lint the Firefox package with addons-linter
        run: |
          npx --yes addons-linter@10.14.0 --output json --boring \
            "dist/firefox/browserplug@marcinwolny.net.xpi" > addons-linter.json
          jq -e '.summary == {"errors": 0, "notices": 0, "warnings": 0}' addons-linter.json
      # The store file names carry an '@' and no version. Release assets get a versioned,
      # URL-safe name, and the checksum file names exactly those.
      - name: Name the release assets and write the checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BASE_VERSION: ${{ steps.version.outputs.base_version }}
        run: |
          mkdir release
          cp "dist/firefox/browserplug@marcinwolny.net.xpi" "release/browserplug-${VERSION}.xpi"
          cp "dist/chrome/browserplug-chromium.zip" "release/browserplug-chromium-${VERSION}.zip"
          cp "dist/firefox/browserplug-source-${BASE_VERSION}.zip" "release/browserplug-source-${VERSION}.zip"
          cp "dist/packages/browserplug-server.zip" "release/browserplug-server-${VERSION}.zip"
          (cd release && sha256sum browserplug-* > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: release/
          if-no-files-found: error

  attest:
    name: Attest build provenance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # sigstore signing for the attestation
      attestations: write # store the build provenance attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: release/
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Both globs together cover the extension, source and server packages.
          subject-path: |
            release/browserplug-*.xpi
            release/browserplug-*.zip
      # OpenSSF Scorecard reads release asset names, not GitHub's attestation store. It counts a
      # *.intoto.jsonl asset as provenance, so the signed bundle also goes out as a file.
      - name: Name the provenance bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          mkdir provenance
          cp "${BUNDLE}" "provenance/browserplug-${VERSION}.intoto.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provenance
          path: provenance/
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub release and upload its assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: release/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: provenance
          path: release/
      - name: Create the release with its assets in one call
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=()
          if [ "${PRERELEASE}" = "true" ]; then flags+=(--prerelease); fi
          gh release create "${TAG}" release/* --verify-tag --generate-notes \
            --title "${TAG}" "${flags[@]}"

  # Downloads what a user would download, from the public release, and checks it the way the
  # install guide tells a user to.
  verify-release:
    name: Verify the published release
    needs: [build, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
      BASE_VERSION: ${{ needs.build.outputs.base_version }}
    steps:
      - name: The release carries exactly the expected assets
        run: |
          expected="$(printf '%s\n' \
            "browserplug-${VERSION}.intoto.jsonl" \
            "browserplug-${VERSION}.xpi" \
            "browserplug-chromium-${VERSION}.zip" \
            "browserplug-server-${VERSION}.zip" \
            "browserplug-source-${VERSION}.zip" \
            SHA256SUMS | sort)"
          found="$(gh release view "${TAG}" --json assets --jq '.assets[].name' | sort)"
          diff <(echo "${expected}") <(echo "${found}")
      - name: Download the release assets
        run: gh release download "${TAG}" --dir verify
      - name: Checksums match
        working-directory: verify
        run: sha256sum --check SHA256SUMS
      - name: The provenance bundle verifies every package
        working-directory: verify
        run: |
          for file in browserplug-"${VERSION}".xpi browserplug-chromium-"${VERSION}".zip browserplug-source-"${VERSION}".zip browserplug-server-"${VERSION}".zip; do
            gh attestation verify "${file}" --repo "${GH_REPO}" --bundle "browserplug-${VERSION}.intoto.jsonl"
            gh attestation verify "${file}" --repo "${GH_REPO}"
          done
      - name: The manifests inside the packages carry the tagged version
        working-directory: verify
        run: |
          for file in browserplug-"${VERSION}".xpi browserplug-chromium-"${VERSION}".zip; do
            found="$(unzip -p "${file}" manifest.json | jq -r .version)"
            echo "${file}: manifest version ${found}"
            test "${found}" = "${BASE_VERSION}" || { echo "::error::${file} has ${found}, expected ${BASE_VERSION}"; exit 1; }
          done
