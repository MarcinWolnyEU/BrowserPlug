name: OpenSSF Scorecard

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 2"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # upload SARIF to code scanning
      id-token: write # publish results to api.securityscorecards.dev (badge)
      contents: read
      actions: read # read workflow metadata for the checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # The default token cannot read branch protection, which leaves the Branch-Protection
          # check at -1. A fine-grained token with read-only "Administration" on this repository,
          # stored as the SCORECARD_TOKEN secret, fixes that. Without the secret the action
          # falls back to the default token and still runs.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
